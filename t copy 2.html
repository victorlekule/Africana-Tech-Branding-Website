<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <section id="portfolio"
    class="py-24 relative overflow-hidden bg-gradient-to-b from-gray-50 to-gray-100 border-t border-gray-200">
    <!-- Decorative background elements -->
    <div class="absolute inset-0 pointer-events-none">
      <div class="absolute top-1/4 -left-32 w-96 h-96 bg-brandBlue/5 rounded-full blur-3xl"></div>
      <div class="absolute bottom-1/4 -right-32 w-96 h-96 bg-brandYellow/5 rounded-full blur-3xl"></div>
    </div>

    <div class="container mx-auto px-4 sm:px-6 relative z-10">
      <!-- Heading -->
      <div class="flex flex-col md:flex-row justify-between items-end mb-12 lg:mb-16 reveal">
        <div class="max-w-2xl">
          <span class="text-brandBlue font-bold tracking-widest uppercase text-sm block mb-2">Portfolio</span>
          <h2 class="text-3xl md:text-4xl lg:text-5xl font-extrabold text-brandBlack tracking-tight leading-tight">
            Recent <span class="bg-gradient-to-r from-brandBlue to-brandYellow bg-clip-text text-transparent">Success
              Stories</span>
          </h2>
        </div>
        <div class="mt-6 md:mt-0 hidden md:block">
          <a href="#"
            class="group inline-flex items-center font-bold text-brandBlack hover:text-brandBlue transition-colors text-lg">
            See All Portfolio
            <svg class="w-5 h-5 ml-2 group-hover:translate-x-2 transition-transform" fill="none" stroke="currentColor"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
            </svg>
          </a>
        </div>
      </div>

      <!-- ========== FUTURISTIC 3D CAROUSEL (Only Active Card Visible) ========== -->
      <div class="relative">
        <div id="premium-3d-carousel" class="relative w-full max-w-5xl mx-auto" style="perspective: 2000px;">
          <div class="flex items-center justify-center relative h-[500px] md:h-[600px]">
            <!-- Cards will be injected here -->
          </div>

          <!-- Navigation Arrows (hidden on mobile) -->
          <button id="carousel-prev"
            class="hidden md:flex absolute top-1/2 -translate-y-1/2 left-4 z-20 w-14 h-14 rounded-full bg-white/10 backdrop-blur-lg shadow-xl border border-white/30 items-center justify-center text-white hover:bg-white/20 hover:scale-105 transition-all duration-300">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
          </button>
          <button id="carousel-next"
            class="hidden md:flex absolute top-1/2 -translate-y-1/2 right-4 z-20 w-14 h-14 rounded-full bg-white/10 backdrop-blur-lg shadow-xl border border-white/30 items-center justify-center text-white hover:bg-white/20 hover:scale-105 transition-all duration-300">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </button>

          <!-- Dots -->
          <div id="carousel-dots" class="flex justify-center gap-2 md:gap-3 mt-6 md:mt-10 flex-wrap"></div>
        </div>

        <!-- See All link -->
        <div class="mt-10 text-center reveal">
          <a href="portfolio.html"
            class="inline-flex items-center font-bold text-brandBlack hover:text-brandBlue transition-colors text-lg">
            See All Portfolio <svg class="w-5 h-5 ml-2 group-hover:translate-x-2 transition-transform" fill="none"
              stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" />
            </svg>
          </a>
        </div>
      </div>
    </div>
  </section>

  <!-- Styles -->
  <style>
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* ========== Futuristic 3D Carousel – Only Active Card Visible ========== */
    #premium-3d-carousel .card-3d {
      position: absolute;
      width: 280px;
      /* Mobile default */
      transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
      transform-style: preserve-3d;
      will-change: transform, opacity, filter;
      cursor: pointer;
      left: 50%;
      pointer-events: none;
      /* Disable interaction on non-active cards */
    }

    /* Active card – fully visible, elevated, glowing */
    #premium-3d-carousel .card-3d.active {
      transform: translateX(-50%) translateZ(0px) rotateY(0deg) scale(1);
      z-index: 10;
      opacity: 1;
      filter: drop-shadow(0 25px 40px rgba(0, 0, 0, 0.3));
      pointer-events: auto;
      /* Enable interaction only on active card */
    }

    /* All non-active cards – hidden but present for transition */
    #premium-3d-carousel .card-3d.prev,
    #premium-3d-carousel .card-3d.next,
    #premium-3d-carousel .card-3d.prev2,
    #premium-3d-carousel .card-3d.next2,
    #premium-3d-carousel .card-3d.prev3,
    #premium-3d-carousel .card-3d.next3,
    #premium-3d-carousel .card-3d.prev4,
    #premium-3d-carousel .card-3d.next4,
    #premium-3d-carousel .card-3d.hidden-card {
      opacity: 0;
      filter: blur(10px);
      transform: translateX(-50%) translateZ(-600px) rotateY(0deg) scale(0.5);
      z-index: 1;
      pointer-events: none;
    }

    /* Premium card inner styling – glass morphism, futuristic */
    #premium-3d-carousel .card-3d .premium-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 2rem;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.5);
      transition: box-shadow 0.4s, transform 0.4s;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Glowing gradient border on active card */
    #premium-3d-carousel .card-3d.active .premium-card::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 2rem;
      padding: 2px;
      background: linear-gradient(135deg, #1e3a8a, #f59e0b, #1e3a8a);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      z-index: 2;
      pointer-events: none;
    }

    #premium-3d-carousel .card-3d .premium-card img {
      transition: transform 0.5s ease;
      height: 220px;
      object-fit: cover;
    }

    #premium-3d-carousel .card-3d.active .premium-card img {
      transform: scale(1.05);
    }

    /* Dots */
    #carousel-dots .dot {
      width: 12px;
      height: 12px;
      border-radius: 9999px;
      background-color: rgba(0, 0, 0, 0.2);
      transition: all 0.4s;
      cursor: pointer;
    }

    #carousel-dots .dot.active {
      background: linear-gradient(135deg, #1e3a8a, #f59e0b);
      width: 36px;
      border-radius: 9999px;
      box-shadow: 0 0 10px rgba(30, 58, 138, 0.5);
    }

    /* Desktop overrides */
    @media (min-width: 768px) {
      #premium-3d-carousel .card-3d {
        width: 420px;
      }

      #premium-3d-carousel .card-3d .premium-card img {
        height: 280px;
      }
    }
  </style>

  <script>
    (function () {
      // ---------- Portfolio Data (10 items) ----------
      const portfolioItems = [
        { img: 'pic/m 1.png', alt: 'Morix Beyond Zanzibar', tag: 'Branding & Tech', title: 'Morix Beyond Zanzibar', desc: 'Complete brand identity, strategic content rollout, and high-performance website for a premium tourism operator.' },
        { img: 'pic/tree 1.png', alt: 'African Child Comforters', tag: 'Tech Solution', title: 'Mr Tree Foundation', desc: 'An integrated digital platform and immersive storytelling website engineered for a major NGO.' },
        { img: 'pic/tech 1.png', alt: 'FPSSA Platform', tag: 'Tech Solution', title: 'FPSSA Student Portal', desc: 'A comprehensive web portal and management system built for the Federation of Procurement and Supplies Student Association.' },
        { img: 'https://via.placeholder.com/600x400?text=Project+4', alt: 'Project Four', tag: 'Branding', title: 'Project Four', desc: 'Short description for project four.' },
        { img: 'https://via.placeholder.com/600x400?text=Project+5', alt: 'Project Five', tag: 'Tech', title: 'Project Five', desc: 'Short description for project five.' },
        { img: 'https://via.placeholder.com/600x400?text=Project+6', alt: 'Project Six', tag: 'Branding & Tech', title: 'Project Six', desc: 'Short description for project six.' },
        { img: 'https://via.placeholder.com/600x400?text=Project+7', alt: 'Project Seven', tag: 'Tech', title: 'Project Seven', desc: 'Short description for project seven.' },
        { img: 'https://via.placeholder.com/600x400?text=Project+8', alt: 'Project Eight', tag: 'Branding', title: 'Project Eight', desc: 'Short description for project eight.' },
        { img: 'https://via.placeholder.com/600x400?text=Project+9', alt: 'Project Nine', tag: 'Tech', title: 'Project Nine', desc: 'Short description for project nine.' },
        { img: 'https://via.placeholder.com/600x400?text=Project+10', alt: 'Project Ten', tag: 'Branding & Tech', title: 'Project Ten', desc: 'Short description for project ten.' }
      ];

      // Helper to create card HTML (premium version)
      function createCardHTML(item) {
        return `
                <div class="premium-card">
                    <div class="overflow-hidden relative">
                        <img src="${item.img}" alt="${item.alt}" class="w-full">
                        <div class="absolute top-4 left-4 bg-gradient-to-r from-brandYellow to-yellow-400 backdrop-blur px-4 py-1.5 rounded-full text-xs font-bold text-brandBlack uppercase tracking-wider shadow-md">
                            ${item.tag}
                        </div>
                    </div>
                    <div class="p-5 md:p-8 flex flex-col flex-1">
                        <h3 class="text-lg md:text-2xl font-bold text-brandBlue mb-2 md:mb-3">${item.title}</h3>
                        <p class="text-gray-600 text-sm md:text-base mb-4 md:mb-6 line-clamp-2">${item.desc}</p>
                        <a href="portfolio.html"
                            class="group mt-auto inline-flex items-center gap-2 text-brandBlack font-bold hover:text-brandBlue transition-colors text-sm md:text-base">
                            View Project
                            <svg class="w-4 h-4 group-hover:translate-x-1 transition-transform" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M13 5l7 7-7 7M5 12h14" />
                            </svg>
                        </a>
                    </div>
                </div>
            `;
      }

      // ---------- Initialize 3D Carousel ----------
      const carouselContainer = document.querySelector('#premium-3d-carousel .flex.items-center');
      const prevBtn = document.getElementById('carousel-prev');
      const nextBtn = document.getElementById('carousel-next');
      const dotsContainer = document.getElementById('carousel-dots');

      let currentIndex = 0;
      let autoplayInterval;

      // Inject cards
      portfolioItems.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card-3d';
        card.dataset.index = index;
        card.innerHTML = createCardHTML(item);
        carouselContainer.appendChild(card);
      });

      // Create dots
      portfolioItems.forEach((_, index) => {
        const dot = document.createElement('button');
        dot.className = 'dot';
        dot.dataset.index = index;
        dot.addEventListener('click', () => goToSlide(index));
        dotsContainer.appendChild(dot);
      });

      const cards = carouselContainer.querySelectorAll('.card-3d');
      const totalCards = cards.length;

      function updateCarousel() {
        cards.forEach((card, index) => {
          // Reset classes
          card.classList.remove('active', 'prev', 'next', 'prev2', 'next2', 'prev3', 'next3', 'prev4', 'next4', 'hidden-card');

          if (index === currentIndex) {
            card.classList.add('active');
          } else {
            // Assign a generic non-active state class for transition
            // We can reuse any class like 'hidden-card' or create a dedicated 'inactive'
            // For simplicity, we'll add 'hidden-card' (or any non-active class) to all others
            card.classList.add('hidden-card');
          }
        });

        // Update dots
        const dots = dotsContainer.querySelectorAll('.dot');
        dots.forEach((dot, index) => dot.classList.toggle('active', index === currentIndex));
      }

      function goToSlide(index) {
        currentIndex = index;
        updateCarousel();
        resetAutoplay();
      }

      function nextSlide() {
        currentIndex = (currentIndex + 1) % totalCards;
        updateCarousel();
        resetAutoplay();
      }

      function prevSlide() {
        currentIndex = (currentIndex - 1 + totalCards) % totalCards;
        updateCarousel();
        resetAutoplay();
      }

      function resetAutoplay() {
        clearInterval(autoplayInterval);
        autoplayInterval = setInterval(nextSlide, 5000);
      }

      // Event listeners
      if (nextBtn) nextBtn.addEventListener('click', nextSlide);
      if (prevBtn) prevBtn.addEventListener('click', prevSlide);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') nextSlide();
        if (e.key === 'ArrowLeft') prevSlide();
      });

      // Touch/swipe support
      let touchStartX = 0;
      let touchEndX = 0;
      carouselContainer.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });

      carouselContainer.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) > 50) {
          if (diff > 0) nextSlide();
          else prevSlide();
        }
      }, { passive: true });

      // Initialize
      updateCarousel();
      resetAutoplay();
    })();
  </script>
</body>

</html>
