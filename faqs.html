        // Generate accordion items
        function createAccordionItems(containerId, items) {
            const container = document.getElementById(containerId);
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'faq-item bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden';
                div.innerHTML = `
                    <button class="faq-question w-full flex justify-between items-center p-5 text-left focus:outline-none">
                        <span class="font-semibold text-brandBlack">${item.q}</span>
                        <svg class="faq-question-icon w-5 h-5 text-brandBlue transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div class="faq-answer px-5 pb-5 text-gray-600 leading-relaxed">${item.a}</div>
                `;
                container.appendChild(div);
            });
        }

        // Populate
        createAccordionItems('tech-faqs-container', faqData.tech);
        createAccordionItems('branding-faqs-container', faqData.branding);
        createAccordionItems('general-faqs-container', faqData.general);

        // Accordion logic
        document.addEventListener('click', function (e) {
            const question = e.target.closest('.faq-question');
            if (!question) return;
            const item = question.closest('.faq-item');
            const answer = item.querySelector('.faq-answer');
            const isOpen = item.classList.contains('active');

            document.querySelectorAll('.faq-item').forEach(i => {
                i.classList.remove('active');
                i.querySelector('.faq-answer').classList.remove('open');
                i.querySelector('.faq-answer').style.maxHeight = '0';
            });

            if (!isOpen) {
                item.classList.add('active');
                answer.classList.add('open');
                answer.style.maxHeight = answer.scrollHeight + 'px';
            }
        });

        // Reveal on scroll
        const revealElements = document.querySelectorAll('.reveal');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.1 });
        revealElements.forEach(el => observer.observe(el));
    </script>
